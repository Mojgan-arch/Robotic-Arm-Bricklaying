[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "masonmind"
version = "0.1.0"
description = "Deterministic robotic masonry with task-level LLM agents"
requires-python = ">=3.10"
dependencies = ["numpy==2.2.6", "scipy==1.15.3", "pydantic==2.11.7", "PyYAML==6.0.2", "shapely==2.1.1", "pybullet==3.2.7; platform_system != 'Windows'", "pybullet-arm64==3.2.8; platform_system == 'Windows'", "imageio==2.37.0", "imageio-ffmpeg==0.6.0", "pillow==11.2.1"]

[project.optional-dependencies]
scan = ["open3d==0.19.0"]
ifc = ["ifcopenshell==0.8.3"]
ui = ["gradio==5.35.0"]
dev = ["pytest==8.4.1"]

[project.scripts]
masonmind = "masonmind.__main__:main"

[tool.setuptools.packages.find]
include = ["masonmind*"]

[tool.setuptools.package-data]
masonmind = ["agents/prompts/*.md", "defaults/*.yaml", "defaults/scenarios/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
